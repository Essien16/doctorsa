services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: doctorsa
      MYSQL_USER: doctorsa_user
      MYSQL_PASSWORD: doctorsa_dev_password
      MYSQL_ROOT_PASSWORD: doctorsa_root_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - doctorsa_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root
          --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_DATABASE_URL: mysql://doctorsa_user:doctorsa_dev_password@database:3306/doctorsa
      SESSION_SECRET: docker-development-session-secret-change-me
      WEBHOOK_SECRET: docker-development-webhook-secret-change-me
      APP_BASE_URL: http://127.0.0.1:3000
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "
        npm run db:mysql:migrate &&
        npm run db:mysql:seed &&
        npm start
      "
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if
          (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  doctorsa_mysql_data:
